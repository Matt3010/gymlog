# The only way in from outside. The API has no published port of its own.
#
# Reached through a Cloudflare Tunnel on the host (HTTPS there, which a PWA
# needs), so nginx listens on plain HTTP inside the container and compose
# binds it to 127.0.0.1 only.

# The visitor's address: Cloudflare's header when the request came through the
# tunnel, the socket otherwise. Only the tunnel and the Pi itself reach this
# port, so the header cannot be forged from outside.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# Login and token renewal: a few a minute per address, on top of the API's own limit.
limit_req_zone $client_ip zone=login:1m rate=6r/m;
# The rest of the API: plenty for logging sets, too little for a flood.
limit_req_zone $client_ip zone=api:5m rate=10r/s;
limit_conn_zone $client_ip zone=perip:5m;

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    autoindex off;

    # The largest request is a whole plan: a few KB.
    client_max_body_size 256k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 15s;
    limit_conn perip 30;
    limit_req_status 429;
    limit_conn_status 429;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json text/plain image/svg+xml;

    types {
        application/manifest+json webmanifest;
    }

    # No hidden files (.env, .git…), even if one ever lands here by mistake.
    location ~ /\. {
        return 404;
    }

    # The app: any path that is not a file is a route of the app.
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ /index.html;

        include /etc/nginx/snippets/security-headers.conf;
        # index.html, the service worker and its manifest change with each deploy: revalidate every time.
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    # Vite's bundles carry a hash in the name, so they never change: cached for a year.
    location /assets/ {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The API, resolved at request time, so nginx starts even while the API is down.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api http://gymlog-api:3000;

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # With its port: the API compares it with the browser's Origin.
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header CF-Connecting-IP "";
        proxy_read_timeout 30s;

        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    # Where passwords and refresh tokens go: strictly rate-limited.
    location ~ ^/api/auth/(login|refresh)$ {
        limit_req zone=login burst=5 nodelay;
        client_max_body_size 4k;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header CF-Connecting-IP "";

        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }
}
